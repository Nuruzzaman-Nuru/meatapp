<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Register - Monthly Contribution Management System</title>
    <link rel="stylesheet" href="css/style.css?v=mobile-menu-6">
</head>
<body>
    <header class="site-header">
        <div class="container site-header-content">
            <a class="site-brand" href="index.html">মাংসের সমিতি</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>
                <a class="nav-login-btn" href="login.html">Login</a>
                <a class="nav-register-btn" href="register.html">Register</a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <section class="member-access">
            <div class="section-heading">
                <p class="section-kicker">Member Area</p>
                <h2>Create account</h2>
            </div>

            <div id="registerForm">
                <h1>Register</h1>
                <div id="registerSuccessCard" class="registration-success-card">
                    <strong>Registration successful</strong>
                    <p>Your account is active. You can login now.</p>
                    <a class="btn btn-primary registration-success-login" href="login.html">Login</a>
                </div>
                <div id="registerAlert" class="alert"></div>

                <div id="registerFields">
                    <div class="form-group">
                        <label for="registerName">Full Name</label>
                        <input type="text" id="registerName" placeholder="Enter your full name">
                    </div>

                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" placeholder="example@gmail.com" pattern="^[^@\s]+@gmail\.com$">
                    </div>

                    <div class="form-group">
                        <label for="registerPhone">Phone Number</label>
                        <input type="tel" id="registerPhone" placeholder="11 digit phone number" inputmode="numeric" maxlength="11" pattern="^\d{11}$">
                    </div>

                    <div class="form-group">
                        <label for="registerPassword">Password</label>
                        <div class="password-field">
                            <input type="password" id="registerPassword" placeholder="At least 6 characters">
                            <button class="password-toggle" type="button" onclick="togglePasswordVisibility('registerPassword', this)" aria-label="Show password">Show</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="registerConfirm">Confirm Password</label>
                        <div class="password-field">
                            <input type="password" id="registerConfirm" placeholder="Confirm your password">
                            <button class="password-toggle" type="button" onclick="togglePasswordVisibility('registerConfirm', this)" aria-label="Show password">Show</button>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button id="registerSubmitBtn" class="btn btn-primary" onclick="handleRegister()">Register</button>
                        <a class="btn btn-secondary" href="login.html">Back to Login</a>
                    </div>

                    <div class="switch-form">
                        Already have an account? <a href="login.html">Login here</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-include="footer"></div>

    <script src="js/components.js?v=mobile-menu-6"></script>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="js/firebase-sync.js?v=auto-active-firebase-2"></script>
    <script src="js/storage.js"></script>
    <script src="js/auth.js?v=auto-active-firebase-2"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            AuthManager.blockIfLoggedIn();
        });

        async function handleRegister() {
            const submitButton = document.getElementById('registerSubmitBtn');
            if (submitButton.disabled) {
                return;
            }

            const formData = {
                name: document.getElementById('registerName').value,
                email: document.getElementById('registerEmail').value,
                phone: document.getElementById('registerPhone').value,
                password: document.getElementById('registerPassword').value,
                confirmPassword: document.getElementById('registerConfirm').value
            };

            const alert = document.getElementById('registerAlert');
            let result;

            alert.style.display = 'none';
            submitButton.disabled = true;
            submitButton.textContent = 'Registering...';

            try {
                result = await AuthManager.register(formData);
            } catch (error) {
                console.error('Registration failed', error);
                result = {
                    success: false,
                    message: 'Registration failed. Please try again.'
                };
            }

            if (result.success) {
                alert.style.display = 'none';
                document.getElementById('registerSuccessCard').style.display = 'block';
                document.getElementById('registerFields').style.display = 'none';

                document.getElementById('registerName').value = '';
                document.getElementById('registerEmail').value = '';
                document.getElementById('registerPhone').value = '';
                document.getElementById('registerPassword').value = '';
                document.getElementById('registerConfirm').value = '';

            } else {
                alert.className = 'alert alert-error';
                alert.textContent = result.message;
                alert.style.display = 'block';
                submitButton.disabled = false;
                submitButton.textContent = 'Register';
            }
        }

        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const shouldShow = input.type === 'password';
            input.type = shouldShow ? 'text' : 'password';
            button.textContent = shouldShow ? 'Hide' : 'Show';
            button.setAttribute('aria-label', shouldShow ? 'Hide password' : 'Show password');
        }

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleRegister();
            }
        });
    </script>
</body>
</html>
