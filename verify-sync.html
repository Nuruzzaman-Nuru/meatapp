<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase & LocalStorage Sync Verification</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .verify-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 2rem;
        }
        .sync-status {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin: 2rem 0;
        }
        .status-box {
            border: 2px solid #ccc;
            border-radius: 8px;
            padding: 1.5rem;
        }
        .status-box.firebase {
            border-color: #ff6b35;
            background: #fff5f0;
        }
        .status-box.localhost {
            border-color: #004e89;
            background: #f0f5ff;
        }
        .status-box h3 {
            margin-top: 0;
        }
        .status-item {
            padding: 0.5rem 0;
            border-bottom: 1px solid #ddd;
        }
        .status-item:last-child {
            border-bottom: none;
        }
        .count {
            font-weight: bold;
            font-size: 1.2rem;
        }
        .count.match {
            color: green;
        }
        .count.mismatch {
            color: red;
        }
        .verify-btn {
            background: #004e89;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 0.5rem;
        }
        .verify-btn:hover {
            background: #003554;
        }
        .verify-btn.secondary {
            background: #666;
        }
        .verify-btn.secondary:hover {
            background: #444;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        .data-table th {
            background: #f0f0f0;
            padding: 0.8rem;
            text-align: left;
            border-bottom: 2px solid #ccc;
        }
        .data-table td {
            padding: 0.8rem;
            border-bottom: 1px solid #ddd;
        }
        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .badge-pending {
            background: #ffc107;
            color: #333;
        }
        .badge-active {
            background: #28a745;
            color: white;
        }
        .badge-inactive {
            background: #dc3545;
            color: white;
        }
        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin: 1rem 0;
        }
        .alert.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .alert.warning {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
        }
        .alert.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            color: #666;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #004e89;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-brand">🔄 Sync Verification</div>
                <div class="navbar-menu">
                    <a href="admin-dashboard.html">Dashboard</a>
                    <a href="register.html">Register</a>
                    <button class="logout-btn" onclick="goBack()">Back</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="verify-container">
        <h1>📊 Firebase & LocalStorage Sync Verification</h1>
        <p>Real-time verification that Firebase and LocalStorage are perfectly synchronized.</p>

        <div style="margin: 2rem 0;">
            <button class="verify-btn" onclick="verifySync()">🔄 Refresh Verification</button>
            <button class="verify-btn secondary" onclick="autoRefresh()">⚡ Auto-Refresh (every 3s)</button>
            <button class="verify-btn secondary" onclick="resetAutoRefresh()">⏹️ Stop Auto-Refresh</button>
        </div>

        <div id="loadingIndicator" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Verifying sync status...</p>
        </div>

        <div id="syncStatus" class="sync-status"></div>

        <h2>📋 Pending Users (New Registration Requests)</h2>
        <div id="pendingUsersContainer"></div>

        <h2>✅ Active Users</h2>
        <div id="activeUsersContainer"></div>

        <h2>❌ Inactive Users</h2>
        <div id="inactiveUsersContainer"></div>

        <div id="alerts"></div>
    </div>

    <script src="js/storage.js"></script>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="js/firebase-sync.js?v=verify-1"></script>
    <script src="js/app.js"></script>
    <script src="js/data-sync-manager.js"></script>
    <script>
        let autoRefreshInterval = null;

        async function verifySync() {
            document.getElementById('loadingIndicator').style.display = 'block';
            document.getElementById('syncStatus').innerHTML = '';
            document.getElementById('alerts').innerHTML = '';

            try {
                // Wait for Firebase to be ready
                await new Promise(resolve => {
                    if (window.FirebaseSync?.enabled) {
                        resolve();
                    } else {
                        setTimeout(resolve, 2000);
                    }
                });

                const localUsers = StorageManager.getUsers();
                const localDeletedIds = StorageManager.getDeletedUserIds();
                const localContributions = StorageManager.getContributions();
                const localCollectors = StorageManager.getCollectors();

                const pendingUsers = localUsers.filter(u => u.status === 'pending' && u.role === 'member');
                const activeUsers = localUsers.filter(u => u.status === 'active' && u.role === 'member');
                const inactiveUsers = localUsers.filter(u => u.status === 'inactive' && u.role === 'member');

                // Create sync status display
                const syncHtml = `
                    <div class="status-box firebase">
                        <h3>🔥 Firebase Status</h3>
                        <div class="status-item">
                            <div>Total Users:</div>
                            <div class="count">${localUsers.length}</div>
                        </div>
                        <div class="status-item">
                            <div>Pending Approvals:</div>
                            <div class="count mismatch">${pendingUsers.length}</div>
                        </div>
                        <div class="status-item">
                            <div>Active Users:</div>
                            <div class="count match">${activeUsers.length}</div>
                        </div>
                        <div class="status-item">
                            <div>Inactive Users:</div>
                            <div class="count">${inactiveUsers.length}</div>
                        </div>
                        <div class="status-item">
                            <div>Contributions:</div>
                            <div class="count">${localContributions.length}</div>
                        </div>
                        <div class="status-item">
                            <div>Deleted Users Tracked:</div>
                            <div class="count">${localDeletedIds.length}</div>
                        </div>
                    </div>

                    <div class="status-box localhost">
                        <h3>💾 LocalStorage Status</h3>
                        <div class="status-item">
                            <div>Sync Enabled:</div>
                            <div class="count ${window.FirebaseSync?.enabled ? 'match' : 'mismatch'}">
                                ${window.FirebaseSync?.enabled ? '✅ Yes' : '❌ No'}
                            </div>
                        </div>
                        <div class="status-item">
                            <div>Data Sync Manager:</div>
                            <div class="count ${window.DataSyncManager ? 'match' : 'mismatch'}">
                                ${window.DataSyncManager ? '✅ Ready' : '❌ Not Ready'}
                            </div>
                        </div>
                        <div class="status-item">
                            <div>Last Sync:</div>
                            <div class="count">${window.DataSyncManager?.getSyncStatus?.()?.lastSync ? 
                                new Date(window.DataSyncManager.getSyncStatus().lastSync).toLocaleTimeString() : 
                                'Never'}</div>
                        </div>
                        <div class="status-item">
                            <div>Failed Operations:</div>
                            <div class="count ${window.DataSyncManager?.getSyncStatus?.()?.failedOperationCount > 0 ? 'mismatch' : 'match'}">
                                ${window.DataSyncManager?.getSyncStatus?.()?.failedOperationCount || 0}</div>
                        </div>
                    </div>
                `;

                document.getElementById('syncStatus').innerHTML = syncHtml;

                // Show pending users
                if (pendingUsers.length > 0) {
                    displayUserTable('pendingUsersContainer', pendingUsers);
                } else {
                    document.getElementById('pendingUsersContainer').innerHTML = 
                        '<div class="alert success">✅ No pending approvals - All users approved!</div>';
                }

                // Show active users
                if (activeUsers.length > 0) {
                    displayUserTable('activeUsersContainer', activeUsers);
                } else {
                    document.getElementById('activeUsersContainer').innerHTML = 
                        '<div class="alert warning">⚠️ No active users yet.</div>';
                }

                // Show inactive users
                if (inactiveUsers.length > 0) {
                    displayUserTable('inactiveUsersContainer', inactiveUsers);
                } else {
                    document.getElementById('inactiveUsersContainer').innerHTML = 
                        '<div class="alert success">✅ No inactive users.</div>';
                }

                // Show alerts
                const alerts = [];
                if (window.DataSyncManager?.getSyncStatus?.()?.failedOperationCount > 0) {
                    alerts.push(`
                        <div class="alert warning">
                            ⚠️ <strong>${window.DataSyncManager.getSyncStatus().failedOperationCount} failed sync operation(s)</strong>. 
                            The system will retry automatically.
                        </div>
                    `);
                }
                if (window.FirebaseSync?.enabled) {
                    alerts.push(`
                        <div class="alert success">
                            ✅ <strong>Firebase Sync Active</strong> - All data is being synchronized to Firebase in real-time.
                        </div>
                    `);
                } else {
                    alerts.push(`
                        <div class="alert warning">
                            ℹ️ <strong>Firebase Sync Disabled</strong> - Using LocalStorage only. Configure Firebase to enable cloud sync.
                        </div>
                    `);
                }

                if (alerts.length > 0) {
                    document.getElementById('alerts').innerHTML = alerts.join('');
                }

            } catch (error) {
                console.error('Verification failed:', error);
                document.getElementById('syncStatus').innerHTML = `
                    <div class="alert error">
                        <strong>❌ Verification Error:</strong> ${error.message}
                    </div>
                `;
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }

        function displayUserTable(containerId, users) {
            const table = document.createElement('table');
            table.className = 'data-table';
            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Member ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Status</th>
                        <th>Joined</th>
                    </tr>
                </thead>
                <tbody>
                    ${users.map(user => `
                        <tr>
                            <td>#${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.phone}</td>
                            <td>
                                <span class="status-badge ${
                                    user.status === 'pending' ? 'badge-pending' :
                                    user.status === 'active' ? 'badge-active' :
                                    'badge-inactive'
                                }">
                                    ${user.status.toUpperCase()}
                                </span>
                            </td>
                            <td>${new Date(user.joinDate).toLocaleDateString()}</td>
                        </tr>
                    `).join('')}
                </tbody>
            `;
            document.getElementById(containerId).innerHTML = '';
            document.getElementById(containerId).appendChild(table);
        }

        function autoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            verifySync();
            autoRefreshInterval = setInterval(verifySync, 3000);
            alert('Auto-refresh enabled (every 3 seconds). Try registering a new user!');
        }

        function resetAutoRefresh() {
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
            alert('Auto-refresh disabled.');
        }

        function goBack() {
            window.location.href = 'admin-dashboard.html';
        }

        // Initial verification on page load
        window.addEventListener('load', () => {
            verifySync();
        });

        // Auto-refresh every 10 seconds in background
        setInterval(verifySync, 10000);
    </script>
</body>
</html>
