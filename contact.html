<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Contact - Monthly Contribution Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container site-header-content">
            <a class="site-brand" href="index.html">মাংসের সমিতি</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="contact.html">Contact</a>
                <a class="nav-login-btn" href="login.html">Login</a>
                <a class="nav-register-btn" href="register.html">Register</a>
            </nav>
        </div>
    </header>

    <main class="contact-page contact-map-page">
        <section class="contact-map-form">
            <div class="contact-map-bg" aria-hidden="true"></div>
            <div class="container contact-form-wrap">
                <form class="contact-message-form" action="mailto:admin@meatsystem.com" method="post" enctype="text/plain">
                    <div class="contact-form-fields">
                        <div class="contact-form-left">
                            <input type="text" name="name" placeholder="Your Name *" required>
                            <input type="email" name="email" placeholder="Your Email *" required>
                            <input type="tel" name="phone" placeholder="Your Phone">
                        </div>
                        <textarea name="message" placeholder="Message *" required></textarea>
                    </div>
                    <div class="contact-form-footer">
                        <p>We will contact you as soon as possible.</p>
                        <button class="contact-send-btn" type="submit">Send Message</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="contact-info-band">
            <div class="container contact-info-grid">
                <div class="contact-info-item">
                    <div class="contact-info-icon">☎</div>
                    <div>
                        <p>Phone:</p>
                        <strong>01307347646</strong>
                    </div>
                </div>

                <div class="contact-info-item">
                    <div class="contact-info-icon">⌖</div>
                    <div>
                        <p>Office Help</p>
                        <strong>New members should register first. Admin approval is required before dashboard access.</strong>
                    </div>
                </div>

                <div class="contact-info-item">
                    <div class="contact-info-icon">✉</div>
                    <div>
                        <p>E-mail: admin@meatsystem.com</p>
                        <strong>WhatsApp: 01307347646</strong>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div data-include="footer"></div>

    <script src="js/components.js"></script>
    <script type="module" src="firebase-config.js"></script>
<script type="module" src="js/firebase-sync.js"></script>
</body>
</html>
