<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Member Dashboard - Contribution System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-brand">💰 Contribution System</div>
                <div class="navbar-menu">
                    <a href="dashboard.html">Dashboard</a>
                    <a href="announcements.html">Announcements</a>
                    <button class="logout-btn" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Welcome Section -->
        <div class="dashboard-welcome">
            <h1>Welcome, <span id="userName">User</span>! 👋</h1>
            <p id="userInfo"></p>
        </div>

        <!-- Alerts -->
        <div id="toast-notification" class="alert"></div>

        <div class="card">
            <h2>&#128276; Firebase Notification</h2>
            <p id="notificationStatus" class="alert" style="display: none;"></p>
            <button id="notificationEnableBtn" class="btn btn-primary" type="button">Enable Notifications</button>
        </div>

        <!-- Dashboard Grid -->
        <div class="dashboard-container">
            <!-- Stats Section -->
            <div class="stats-grid">
                <div class="stat-box primary">
                    <div class="stat-label">Total Contributions</div>
                    <div class="stat-value" id="totalContrib">0</div>
                </div>
                <div class="stat-box success">
                    <div class="stat-label">Amount Paid</div>
                    <div class="stat-value" id="totalPaid">0 BDT</div>
                </div>
                <div class="stat-box danger">
                    <div class="stat-label">Amount Due</div>
                    <div class="stat-value" id="totalDue">0 BDT</div>
                </div>
                <div class="stat-box warning">
                    <div class="stat-label">Join Date</div>
                    <div class="stat-value font-sm" id="joinDate">-</div>
                </div>
            </div>

            <!-- Current Month Section -->
            <div class="card">
                <h2>📅 Current Month Status</h2>
                <div id="currentMonthContent"></div>
            </div>

            <!-- Collector Info -->
            <div class="card">
                <h2>👥 This Month's Collectors</h2>
                <div id="collectorInfo"></div>
            </div>

            <!-- Quick Pay Section -->
            <div class="card">
                <h2>💳 Record Payment</h2>
                <div class="form-group">
                    <label for="paymentMonth">Select Month</label>
                    <select id="paymentMonth">
                        <option value="">-- Select Month --</option>
                    </select>
                </div>

                <div id="paymentMonthMessage" class="alert" style="display: none;"></div>

                <div class="form-group">
                    <label for="paymentMethod">Payment Method</label>
                    <select id="paymentMethod">
                        <option value="cash">Cash</option>
                        <option value="online">Online Transfer</option>
                        <option value="cheque">Cheque</option>
                    </select>
                </div>

                <!-- <div class="form-group">
                    <label for="paymentProof">Payment Proof (Photo)</label>
                    <input type="file" id="paymentProof" accept="image/*" capture="environment">
                    <small style="color: #6b7280; display: block; margin-top: 0.3rem;">Upload payment screenshot or photo</small>
                </div> -->

                <div class="form-group">
    <label for="paymentPaidBy">Transaction ID / Paid To</label>
    
    <input 
        type="text" 
        id="paymentPaidBy" 
        placeholder="e.g., TrxID: 8HG72K or Nuru"
        required
    />
</div>

                <button class="btn btn-success btn-block" onclick="recordCurrentPayment()">Mark as Paid</button>
            </div>

            <!-- Contribution History -->
            <div class="card">
                <div class="flex-between" style="margin-bottom: 1rem;">
                    <h2>📊 Contribution History</h2>
                    <button class="btn btn-primary" onclick="handlePrintReport()" style="margin: 0;white-space: nowrap;">🖨️ Print Report</button>
                </div>
                <div id="historyTable"></div>
            </div>
        </div>
    </div>

    <!-- Modal for Detailed Payment -->
    <div id="paymentModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Payment Details</h2>
                <button class="close-btn" onclick="closePaymentModal()">&times;</button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script type="module" src="js/notifications.js"></script>
    <script>
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (!AuthManager.requireAuth()) return;

            currentUser = AuthManager.getCurrentUser();
            initializeDashboard();
            populateMonthSelector();
        });

        function initializeDashboard() {
            // Set user info
            document.getElementById('userName').textContent = currentUser.name.split(' ')[0];
            document.getElementById('userInfo').textContent = `Email: ${currentUser.email} | Phone: ${currentUser.phone}`;

            // Get stats
            const summary = App.getUserContributionSummary(currentUser.id);
            document.getElementById('totalContrib').textContent = summary.totalContributions;
            document.getElementById('totalPaid').textContent = App.formatCurrency(summary.totalPaid);
            document.getElementById('totalDue').textContent = App.formatCurrency(summary.totalDue);
            document.getElementById('joinDate').textContent = App.formatDate(currentUser.joinDate);

            // Current month status
            loadCurrentMonthStatus();

            // Collector info
            loadCollectorInfo();

            // History
            loadHistory();
        }

        function loadCurrentMonthStatus() {
            const { month, year } = App.getCurrentMonthYear();
            const contributions = StorageManager.getMonthContributions(month, year);
            const userContribution = contributions.find(c => c.userId === currentUser.id);

            let html = '';
            if (userContribution) {
                const statusBadge = getContributionStatusBadge(userContribution.status);

                html = `
                    <div style="padding: 1rem; background: #f5f5f5; border-radius: 4px;">
                        <p><strong>Month:</strong> ${App.getMonthName(month)} ${year}</p>
                        <p><strong>Amount:</strong> ${App.formatCurrency(userContribution.amount)}</p>
                        <p><strong>Status:</strong> ${statusBadge}</p>
                        ${userContribution.paymentDate ? `<p><strong>Paid on:</strong> ${App.formatDate(userContribution.paymentDate)}</p>` : ''}
                        ${userContribution.paymentRequestedAt && userContribution.status === 'pending' ? `<p><strong>Requested on:</strong> ${App.formatDate(userContribution.paymentRequestedAt)}</p>` : ''}
                    </div>
                `;
            } else {
                // Try to generate if not exists (will be null if user joined after this month)
                const generated = StorageManager.getOrCreateContribution(currentUser.id, month, year);
                if (generated) {
                    html = `
                        <div style="padding: 1rem; background: #f5f5f5; border-radius: 4px;">
                            <p><strong>Month:</strong> ${App.getMonthName(month)} ${year}</p>
                            <p><strong>Amount:</strong> ${App.formatCurrency(200)}</p>
                            <p><strong>Status:</strong> <span class="table-badge badge-danger">✗ UNPAID</span></p>
                        </div>
                    `;
                } else {
                    html = `
                        <div style="padding: 1rem; background: #fff6f6; border-radius: 4px;">
                            <p><strong>Month:</strong> ${App.getMonthName(month)} ${year}</p>
                            <p style="color:#555;">You did not have an account in this month.</p>
                        </div>
                    `;
                }
            }

            document.getElementById('currentMonthContent').innerHTML = html;
        }

        function getContributionStatusBadge(status) {
            if (status === 'paid') {
                return '<span class="table-badge badge-success">PAID</span>';
            }

            if (status === 'pending') {
                return '<span class="table-badge badge-warning">WAITING FOR ADMIN CONFIRMATION</span>';
            }

            return '<span class="table-badge badge-danger">UNPAID</span>';
        }

        function loadCollectorInfo() {
            const { month, year } = App.getCurrentMonthYear();
            const collectors = App.getMonthCollectorNames(month, year);

            let html = '';
            if (collectors.length > 0) {
                html = '<div style="display: grid; gap: 1rem;">';
                collectors.forEach(collector => {
                    html += `
                        <div style="padding: 1rem; background: #f9f9f9; border-left: 4px solid var(--primary-color); border-radius: 4px;">
                            <p><strong>📌 ${collector.name}</strong></p>
                            <p style="font-size: 0.9rem; color: #666;">Phone: ${collector.phone}</p>
                        </div>
                    `;
                });
                html += '</div>';
            } else {
                html = '<p style="color: #999;">No collectors assigned for this month yet.</p>';
            }

            document.getElementById('collectorInfo').innerHTML = html;
        }

        function populateMonthSelector() {
            const select = document.getElementById('paymentMonth');
            const { month, year } = App.getCurrentMonthYear();

            // Add last 12 months
            for (let i = 11; i >= 0; i--) {
                let m = month - i;
                let y = year;
                if (m <= 0) {
                    m += 12;
                    y -= 1;
                }
                const monthName = App.getMonthName(m);
                const option = document.createElement('option');
                option.value = `${m}-${y}`;
                option.textContent = `${monthName} ${y}`;
                select.appendChild(option);
            }

            // Add change listener
            select.addEventListener('change', checkSelectedMonthStatus);
        }

        function checkSelectedMonthStatus() {
            const monthYear = document.getElementById('paymentMonth').value;

            if (!monthYear) {
                clearPaymentMonthMessage();
                return;
            }

            const [month, year] = monthYear.split('-').map(Number);
            const contribution = StorageManager.getOrCreateContribution(currentUser.id, month, year);

            if (!contribution) {
                showPaymentMonthMessage('You did not have an account in the selected month.', 'warning');
                return;
            }

            if (contribution.status === 'paid') {
                const warningMessage = `⚠️ Already Payment This Month - ${App.getMonthName(month)} ${year} (${App.formatCurrency(contribution.amount)})`;
                showPaymentMonthMessage(warningMessage, 'warning');
            } else if (contribution.status === 'pending') {
                const warningMessage = `Payment request already submitted - ${App.getMonthName(month)} ${year} (${App.formatCurrency(contribution.amount)})`;
                showPaymentMonthMessage(warningMessage, 'warning');
            } else {
                clearPaymentMonthMessage();
            }
        }

        function showPaymentMonthMessage(message, type = 'info') {
            const messageBox = document.getElementById('paymentMonthMessage');
            messageBox.textContent = message;
            messageBox.className = `alert alert-${type}`;
            messageBox.style.display = 'block';
        }

        function clearPaymentMonthMessage() {
            const messageBox = document.getElementById('paymentMonthMessage');
            messageBox.textContent = '';
            messageBox.style.display = 'none';
        }

        async function recordCurrentPayment() {
            const monthYear = document.getElementById('paymentMonth').value;
            const method = document.getElementById('paymentMethod').value;
            const proofFileInput = document.getElementById('paymentProof');
            const proofFile = proofFileInput ? proofFileInput.files[0] : null;
            const paidBy = document.getElementById('paymentPaidBy').value.trim();

            if (!monthYear) {
                App.showToast('Please select a month', 'warning');
                clearPaymentMonthMessage();
                return;
            }

            const [month, year] = monthYear.split('-').map(Number);
            const contribution = StorageManager.getOrCreateContribution(currentUser.id, month, year);
            
            console.log('Current contribution:', contribution);

            if (!contribution) {
                App.showToast('You did not have an account for the selected month.', 'warning');
                return;
            }

            if (contribution.status === 'paid') {
                const warningMessage = `⚠️ Already Payment This Month - ${App.getMonthName(month)} ${year} (${App.formatCurrency(contribution.amount)})`;
                showPaymentMonthMessage(warningMessage, 'warning');
                return;
            }

            if (contribution.status === 'pending') {
                const warningMessage = `Payment request already submitted - ${App.getMonthName(month)} ${year} (${App.formatCurrency(contribution.amount)})`;
                showPaymentMonthMessage(warningMessage, 'warning');
                return;
            }

            // If proof file exists, convert to base64
            if (proofFile) {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const paymentProof = e.target.result;
                    const result = App.recordPayment(contribution.id, method, paidBy, paymentProof);
                    if (result.success) {
                        await syncPaymentRequestToFirebase();
                        // Show immediate success toast
                        App.showToast('Payment request submitted successfully!', 'success');
                        console.log('Payment success:', result);
                        
                        // IMMEDIATELY refresh history
                        console.log('Immediately refreshing history (file)...');
                        loadHistory();
                        
                        // Reset form
                        document.getElementById('paymentMonth').value = '';
                        clearPaymentMonthMessage();
                        document.getElementById('paymentMethod').value = 'cash';
                        const proofInput = document.getElementById('paymentProof');
                        if (proofInput) proofInput.value = '';
                        document.getElementById('paymentPaidBy').value = '';
                        
                        // Show detailed success modal
                        setTimeout(() => {
                            showPaymentSuccessScreen(result.contribution, method, paidBy);
                        }, 100);
                        
                        // Full refresh after modal
                        setTimeout(() => {
                            console.log('Refreshing full dashboard (file)...');
                            initializeDashboard();
                        }, 3000);
                    } else {
                        console.error('Payment failed (file):', result);
                        App.showToast(result.message, 'error');
                    }
                };
                reader.readAsDataURL(proofFile);
            } else {
                const result = App.recordPayment(contribution.id, method, paidBy, null);
                if (result.success) {
                    await syncPaymentRequestToFirebase();
                    // Show immediate success toast
                    App.showToast('Payment request submitted successfully!', 'success');
                    console.log('Payment success:', result);
                    
                    // IMMEDIATELY refresh the history to show updated status
                    console.log('Immediately refreshing history...');
                    loadHistory();
                    
                    // Reset form immediately
                    document.getElementById('paymentMonth').value = '';
                    clearPaymentMonthMessage();
                    document.getElementById('paymentMethod').value = 'cash';
                    const proofInputEl = document.getElementById('paymentProof');
                    if (proofInputEl) proofInputEl.value = '';
                    document.getElementById('paymentPaidBy').value = '';
                    
                    // Show detailed success modal
                    setTimeout(() => {
                        showPaymentSuccessScreen(result.contribution, method, paidBy);
                    }, 100);
                    
                    // Refresh dashboard stats after modal
                    setTimeout(() => {
                        console.log('Refreshing full dashboard...');
                        initializeDashboard();
                    }, 3000);
                } else {
                    console.error('Payment failed (no file):', result);
                    App.showToast(result.message, 'error');
                }
            }
        }

        async function syncPaymentRequestToFirebase() {
            if (!window.FirebaseSync?.enabled) return;

            try {
                await FirebaseSync.syncCollectionToFirebase('contributions');
            } catch (error) {
                console.error('Payment request Firebase sync failed', error);
                App.showToast('Payment request saved locally, but admin sync may be delayed', 'warning');
            }
        }

        function showPaymentSuccessScreen(contribution, method, paidBy = '') {
            const monthName = App.getMonthName(contribution.month);
            const paidDate = new Date().toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            let html = `
                <div style="text-align: center; padding: 2rem;">
                    <div style="font-size: 3rem; margin-bottom: 1rem;">✅</div>
                    
                    <h2 style="color: #27ae60; margin-bottom: 1rem; font-size: 1.8rem;">Payment Request Submitted!</h2>
                    
                    <div style="background: #d5f4e6; padding: 1.5rem; border-radius: 8px; margin: 2rem 0; text-align: left;">
                        <p style="margin: 0.5rem 0;"><strong>Member:</strong> ${currentUser.name}</p>
                        <p style="margin: 0.5rem 0;"><strong>Month:</strong> ${monthName} ${contribution.year}</p>
                        <p style="margin: 0.5rem 0;"><strong>Amount:</strong> <span style="font-size: 1.2rem; color: #27ae60; font-weight: bold;">${App.formatCurrency(contribution.amount)}</span></p>
                        <p style="margin: 0.5rem 0;"><strong>Payment Method:</strong> ${method.charAt(0).toUpperCase() + method.slice(1)}</p>
                        ${paidBy ? `<p style="margin: 0.5rem 0;"><strong>Paid By:</strong> ${paidBy}</p>` : ''}
                        ${contribution.paymentProof ? `<p style="margin: 0.5rem 0;"><strong>Receipt:</strong> <span style="color: #27ae60; font-weight: bold;">✓ Uploaded</span></p>` : ''}
                        <p style="margin: 0.5rem 0;"><strong>Request Time:</strong> ${paidDate}</p>
                        <p style="margin: 0.5rem 0;"><strong>Status:</strong> <span style="background: #f59e0b; color: white; padding: 0.3rem 0.8rem; border-radius: 4px;">WAITING FOR ADMIN CONFIRMATION</span></p>
                    </div>

                    <div style="background: #ecf0f1; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem;">
                        <p style="margin: 0; color: #555; font-size: 0.9rem;">Your payment request has been submitted. Admin will confirm it shortly.</p>
                    </div>

                    <button class="btn btn-success" onclick="closePaymentModal()" style="padding: 0.8rem 2rem; font-size: 1rem; margin-top: 1.5rem;">Great! Close</button>
                </div>
            `;

            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('paymentModal').classList.add('show');
        }

        function loadHistory() {
            const summary = App.getUserContributionSummary(currentUser.id);
            const contributions = summary.contributions.sort((a, b) => {
                const aKey = a.year * 12 + a.month;
                const bKey = b.year * 12 + b.month;
                return bKey - aKey; // Newest first
            });

            let html = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Payment Method</th>
                            <th>Paid By</th>
                            <th>Paid Date</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            if (contributions.length === 0) {
                html += '<tr><td colspan="6" style="text-align: center; color: #999;">No contribution history</td></tr>';
            } else {
                contributions.forEach(c => {
                    const statusBadge = getContributionStatusBadge(c.status);

                    html += `
                        <tr>
                            <td>${App.getMonthName(c.month)} ${c.year}</td>
                            <td>${App.formatCurrency(c.amount)}</td>
                            <td>${statusBadge}</td>
                            <td>${c.paymentMethod || '-'}</td>
                            <td>${c.paidBy || '-'}</td>
                            <td>${c.paymentDate ? App.formatDate(c.paymentDate) : '-'}</td>
                        </tr>
                    `;
                });
            }

            html += '</tbody></table>';
            document.getElementById('historyTable').innerHTML = html;
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').classList.remove('show');
        }

        function handlePrintReport() {
            const summary = App.getUserContributionSummary(currentUser.id);
            const { month, year } = App.getCurrentMonthYear();
            
            let printContent = `
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Contribution Report - ${currentUser.name}</title>
                    <style>
                        body { font-family: Arial, sans-serif; margin: 20px; }
                        .header { text-align: center; margin-bottom: 30px; border-bottom: 2px solid #333; padding-bottom: 10px; }
                        .header h1 { margin: 0; color: #333; }
                        .header p { margin: 5px 0; color: #666; }
                        .section { margin: 20px 0; }
                        .section h2 { background: #f0f0f0; padding: 10px; margin: 10px 0 10px 0; border-left: 4px solid #667eea; }
                        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
                        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
                        th { background-color: #667eea; color: white; }
                        .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 15px 0; }
                        .summary-box { padding: 15px; background: #f9f9f9; border: 1px solid #ddd; border-radius: 4px; }
                        .summary-label { font-size: 0.9rem; color: #666; }
                        .summary-value { font-size: 1.5rem; font-weight: bold; color: #333; }
                        .footer { margin-top: 30px; text-align: center; color: #999; font-size: 0.9rem; border-top: 1px solid #ddd; padding-top: 10px; }
                        @media (max-width: 768px) {
                            .summary { grid-template-columns: 1fr; }
                        }
                        @media (max-width: 480px) {
                            .summary { grid-template-columns: 1fr; }
                            .summary-box { padding: 12px; }
                        }
                        @media print { body { margin: 0; } }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>Contribution Report</h1>
                        <p><strong>${currentUser.name}</strong></p>
                        <p>Email: ${currentUser.email} | Phone: ${currentUser.phone}</p>
                        <p>Printed on: ${new Date().toLocaleString()}</p>
                    </div>

                    <div class="section">
                        <h2>Summary</h2>
                        <div class="summary">
                            <div class="summary-box">
                                <div class="summary-label">Total Contributions</div>
                                <div class="summary-value">${summary.totalContributions}</div>
                            </div>
                            <div class="summary-box">
                                <div class="summary-label">Amount Paid</div>
                                <div class="summary-value">${App.formatCurrency(summary.totalPaid)}</div>
                            </div>
                            <div class="summary-box">
                                <div class="summary-label">Amount Due</div>
                                <div class="summary-value">${App.formatCurrency(summary.totalDue)}</div>
                            </div>
                            <div class="summary-box">
                                <div class="summary-label">Member Since</div>
                                <div class="summary-value">${App.formatDate(currentUser.joinDate)}</div>
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <h2>Contribution History</h2>
                        <table>
                            <thead>
                                <tr>
                                    <th>Month</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Payment Method</th>
                                    <th>Paid Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${summary.contributions.sort((a, b) => {
                                    const aKey = a.year * 12 + a.month;
                                    const bKey = b.year * 12 + b.month;
                                    return bKey - aKey;
                                }).map(c => `
                                    <tr>
                                        <td>${App.getMonthName(c.month)} ${c.year}</td>
                                        <td>${App.formatCurrency(c.amount)}</td>
                                        <td>${c.status === 'paid' ? 'PAID' : c.status === 'pending' ? 'PENDING ADMIN CONFIRMATION' : 'UNPAID'}</td>
                                        <td>${c.paymentMethod || '-'}</td>
                                        <td>${c.paymentDate ? App.formatDate(c.paymentDate) : '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>

                    <div class="footer">
                        <p>মাংসের সমিতি - Contribution Management System</p>
                        <p>This is an official report. Please keep it safe for your records.</p>
                    </div>
                </body>
                </html>
            `;
            
            const printWindow = window.open('', 'printReport', 'height=600,width=900');
            printWindow.document.write(printContent);
            printWindow.document.close();
            setTimeout(() => { printWindow.print(); }, 250);
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                AuthManager.logout();
                window.location.href = 'index.html';
            }
        }
    </script>
    <script type="module" src="firebase-config.js"></script>
<script type="module" src="js/firebase-sync.js"></script>
</body>
</html>
