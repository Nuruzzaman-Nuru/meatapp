<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>নোটিশ - Contribution System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-brand">💰 Contribution System</div>
                <div class="navbar-menu">
                    <a id="dashboardNavLink" href="dashboard.html">Dashboard</a>
                    <a href="announcements.html">নোটিশ</a>
                    <button class="logout-btn" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Welcome Section -->
        <div style="margin: 2rem 0; padding: 2rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 8px;">
            <h1>📢 নোটিশ</h1>
            <p>গুরুত্বপূর্ণ আপডেট ও সভার তথ্য</p>
        </div>

        <!-- Alerts -->
        <div id="toast-notification" class="alert"></div>

        <!-- Admin Add Announcement (Admin only) -->
        <div id="adminSection" style="display: none;">
            <div class="card" style="margin-bottom: 2rem;">
                <h2>📝 নোটিশ পোস্ট করুন</h2>
                
                <div class="form-group">
                    <label for="announcementTitle">শিরোনাম</label>
                    <input type="text" id="announcementTitle" placeholder="নোটিশের শিরোনাম লিখুন">
                </div>

                <div class="form-group">
                    <label for="announcementType">ধরন</label>
                    <select id="announcementType">
                        <option value="general">সাধারণ নোটিশ</option>
                        <option value="meeting">সভা</option>
                        <option value="decision">সিদ্ধান্ত/আপডেট</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="announcementContent">বিস্তারিত</label>
                    <textarea id="announcementContent" placeholder="নোটিশের বিস্তারিত লিখুন"></textarea>
                </div>

                <button class="btn btn-primary btn-block" onclick="postAnnouncement()">📤 নোটিশ পোস্ট করুন</button>
            </div>
        </div>

        <!-- Announcements List -->
        <div class="dashboard-container">
            <div class="card">
                <h2>📋 সকল নোটিশ</h2>
                <div id="announcementsList"></div>
            </div>
        </div>
    </div>
 <div data-include="footer"></div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js?v=single-admin-pass-1"></script>
    <script src="js/app.js"></script>
    <script>
        let currentUser = null;
        let announcementsRefreshTimer = null;
        let announcementsRefreshInProgress = false;

        window.addEventListener('DOMContentLoaded', () => {
            if (!AuthManager.requireAuth()) return;

            currentUser = AuthManager.getCurrentUser();

            // Show admin section if user is admin
            if (AuthManager.isAdmin()) {
                document.getElementById('dashboardNavLink').href = 'admin-dashboard.html';
                document.getElementById('adminSection').style.display = 'block';
            }

            loadAnnouncements();
            startAnnouncementsAutoRefresh();
        });

        window.addEventListener('firebase-sync-ready', () => {
            if (!AuthManager.isLoggedIn()) return;
            refreshAnnouncementsFromFirebase();
            startAnnouncementsAutoRefresh();
        });

        window.addEventListener('focus', () => {
            if (AuthManager.isLoggedIn()) {
                refreshAnnouncementsFromFirebase();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && AuthManager.isLoggedIn()) {
                refreshAnnouncementsFromFirebase();
            }
        });

        async function postAnnouncement() {
            const title = document.getElementById('announcementTitle').value.trim();
            const type = document.getElementById('announcementType').value;
            const content = document.getElementById('announcementContent').value.trim();

            if (!title || !content) {
                App.showToast('সব তথ্য পূরণ করুন', 'warning');
                return;
            }

            if (window.FirebaseSync?.ready) {
                await FirebaseSync.ready;
            }

            const announcement = StorageManager.addAnnouncement({
                title,
                type,
                content,
                createdByName: currentUser.name,
                createdById: currentUser.id
            });

            preservePostedAnnouncement(announcement);
            loadAnnouncements();
            await syncAnnouncementsToFirebase(announcement);
            App.showToast('নোটিশ সফলভাবে পোস্ট হয়েছে', 'success');

            // Clear form
            document.getElementById('announcementTitle').value = '';
            document.getElementById('announcementType').value = 'general';
            document.getElementById('announcementContent').value = '';

            // Reload announcements
            loadAnnouncements();
        }

        function loadAnnouncements() {
            const announcements = StorageManager.getAnnouncements();
            const sorted = announcements.sort((a, b) => 
                new Date(b.createdAt) - new Date(a.createdAt)
            );

            let html = '';
            if (sorted.length === 0) {
                html = '<p style="color: #999; text-align: center; padding: 2rem;">এখনো কোনো নোটিশ নেই।</p>';
            } else {
                sorted.forEach(announcement => {
                    const typeIcon = {
                        'meeting': '🗓️',
                        'decision': '✅',
                        'general': '📢'
                    }[announcement.type] || '📢';

                    const typeBg = {
                        'meeting': '#e3f2fd',
                        'decision': '#f3e5f5',
                        'general': '#f5f5f5'
                    }[announcement.type] || '#f5f5f5';

                    html += `
                        <div style="background: ${typeBg}; padding: 1.5rem; margin-bottom: 1.5rem; border-radius: 4px; border-left: 4px solid var(--primary-color);">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem;">
                                <h3 style="margin: 0; color: var(--primary-color);">${typeIcon} ${escapeHtml(announcement.title)}</h3>
                                ${currentUser.id === announcement.createdById ? `
                                    <button style="background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 1.2rem;" onclick="deleteAnnouncement(${announcement.id})">🗑️</button>
                                ` : ''}
                            </div>
                            <p style="color: #666; font-size: 0.9rem; margin-bottom: 1rem;">
                                <strong>পোস্ট করেছেন:</strong> ${escapeHtml(announcement.createdByName || 'Admin')} | 
                                <strong>তারিখ:</strong> ${App.formatDate(announcement.createdAt)}
                            </p>
                            <p style="line-height: 1.6; white-space: pre-wrap;">${escapeHtml(announcement.content)}</p>
                        </div>
                    `;
                });
            }

            document.getElementById('announcementsList').innerHTML = html;
        }

        function startAnnouncementsAutoRefresh() {
            if (announcementsRefreshTimer) return;

            announcementsRefreshTimer = setInterval(() => {
                if (!document.hidden && AuthManager.isLoggedIn()) {
                    refreshAnnouncementsFromFirebase();
                }
            }, 10000);
        }

        async function refreshAnnouncementsFromFirebase() {
            if (!window.FirebaseSync?.enabled || announcementsRefreshInProgress) return;

            announcementsRefreshInProgress = true;
            try {
                if (window.FirebaseSync?.ready) {
                    await FirebaseSync.ready;
                }
                await FirebaseSync.syncFromFirebase();
                loadAnnouncements();
            } catch (error) {
                console.error('Announcements Firebase refresh failed', error);
            } finally {
                announcementsRefreshInProgress = false;
            }
        }

        async function syncAnnouncementsToFirebase(announcement = null) {
            if (window.FirebaseSync?.ready) {
                await FirebaseSync.ready;
            }

            preservePostedAnnouncement(announcement);

            if (!window.FirebaseSync?.enabled) return;

            try {
                await FirebaseSync.syncCollectionToFirebase('announcements');
            } catch (error) {
                preservePostedAnnouncement(announcement);
                console.error('Announcement Firebase sync failed', error);
                App.showToast('নোটিশ লোকালি সেভ হয়েছে, কিন্তু সবার কাছে যেতে দেরি হতে পারে', 'warning');
            }
        }

        function preservePostedAnnouncement(announcement) {
            if (!announcement) return;

            const announcements = StorageManager.getAnnouncements();
            const existingIndex = announcements.findIndex(item => Number(item.id) === Number(announcement.id));

            if (existingIndex >= 0) {
                announcements[existingIndex] = {
                    ...announcements[existingIndex],
                    ...announcement
                };
            } else {
                announcements.push(announcement);
            }

            localStorage.setItem(StorageManager.KEYS.ANNOUNCEMENTS, JSON.stringify(announcements));
        }

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }

        async function deleteAnnouncement(id) {
            if (confirm('এই নোটিশ মুছে ফেলতে চান?')) {
                StorageManager.deleteAnnouncement(id);
                await syncAnnouncementsToFirebase();
                App.showToast('নোটিশ মুছে ফেলা হয়েছে', 'success');
                loadAnnouncements();
            }
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                AuthManager.logout();
                window.location.href = 'index.html';
            }
        }
    </script>
    <script type="module" src="firebase-config.js"></script>
<script type="module" src="js/firebase-sync.js"></script>
 
</body>
</html>
