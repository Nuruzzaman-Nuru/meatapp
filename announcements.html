<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Announcements - Contribution System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <div class="navbar-brand">💰 Contribution System</div>
                <div class="navbar-menu">
                    <a id="dashboardNavLink" href="dashboard.html">Dashboard</a>
                    <a href="announcements.html">Announcements</a>
                    <button class="logout-btn" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Welcome Section -->
        <div style="margin: 2rem 0; padding: 2rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 8px;">
            <h1>📢 Announcements & Meetings</h1>
            <p>Important updates and meeting information</p>
        </div>

        <!-- Alerts -->
        <div id="toast-notification" class="alert"></div>

        <!-- Admin Add Announcement (Admin only) -->
        <div id="adminSection" style="display: none;">
            <div class="card" style="margin-bottom: 2rem;">
                <h2>📝 Post Announcement</h2>
                
                <div class="form-group">
                    <label for="announcementTitle">Title</label>
                    <input type="text" id="announcementTitle" placeholder="Enter announcement title">
                </div>

                <div class="form-group">
                    <label for="announcementType">Type</label>
                    <select id="announcementType">
                        <option value="general">General Announcement</option>
                        <option value="meeting">Meeting Info</option>
                        <option value="decision">Decision/Update</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="announcementContent">Content</label>
                    <textarea id="announcementContent" placeholder="Enter detailed announcement"></textarea>
                </div>

                <button class="btn btn-primary btn-block" onclick="postAnnouncement()">📤 Post Announcement</button>
            </div>
        </div>

        <!-- Announcements List -->
        <div class="dashboard-container">
            <div class="card">
                <h2>📋 All Announcements</h2>
                <div id="announcementsList"></div>
            </div>
        </div>
    </div>
 <div data-include="footer"></div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', () => {
            if (!AuthManager.requireAuth()) return;

            currentUser = AuthManager.getCurrentUser();

            // Show admin section if user is admin
            if (AuthManager.isAdmin()) {
                document.getElementById('dashboardNavLink').href = 'admin-dashboard.html';
                document.getElementById('adminSection').style.display = 'block';
            }

            loadAnnouncements();
        });

        function postAnnouncement() {
            const title = document.getElementById('announcementTitle').value.trim();
            const type = document.getElementById('announcementType').value;
            const content = document.getElementById('announcementContent').value.trim();

            if (!title || !content) {
                App.showToast('Please fill in all fields', 'warning');
                return;
            }

            StorageManager.addAnnouncement({
                title,
                type,
                content,
                createdByName: currentUser.name,
                createdById: currentUser.id
            });

            App.showToast('Announcement posted successfully!', 'success');

            // Clear form
            document.getElementById('announcementTitle').value = '';
            document.getElementById('announcementType').value = 'general';
            document.getElementById('announcementContent').value = '';

            // Reload announcements
            loadAnnouncements();
        }

        function loadAnnouncements() {
            const announcements = StorageManager.getAnnouncements();
            const sorted = announcements.sort((a, b) => 
                new Date(b.createdAt) - new Date(a.createdAt)
            );

            let html = '';
            if (sorted.length === 0) {
                html = '<p style="color: #999; text-align: center; padding: 2rem;">No announcements yet.</p>';
            } else {
                sorted.forEach(announcement => {
                    const typeIcon = {
                        'meeting': '🗓️',
                        'decision': '✅',
                        'general': '📢'
                    }[announcement.type] || '📢';

                    const typeBg = {
                        'meeting': '#e3f2fd',
                        'decision': '#f3e5f5',
                        'general': '#f5f5f5'
                    }[announcement.type] || '#f5f5f5';

                    html += `
                        <div style="background: ${typeBg}; padding: 1.5rem; margin-bottom: 1.5rem; border-radius: 4px; border-left: 4px solid var(--primary-color);">
                            <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 0.5rem;">
                                <h3 style="margin: 0; color: var(--primary-color);">${typeIcon} ${announcement.title}</h3>
                                ${currentUser.id === announcement.createdById ? `
                                    <button style="background: none; border: none; color: var(--danger-color); cursor: pointer; font-size: 1.2rem;" onclick="deleteAnnouncement(${announcement.id})">🗑️</button>
                                ` : ''}
                            </div>
                            <p style="color: #666; font-size: 0.9rem; margin-bottom: 1rem;">
                                <strong>By:</strong> ${announcement.createdByName} | 
                                <strong>Date:</strong> ${App.formatDate(announcement.createdAt)}
                            </p>
                            <p style="line-height: 1.6; white-space: pre-wrap;">${announcement.content}</p>
                        </div>
                    `;
                });
            }

            document.getElementById('announcementsList').innerHTML = html;
        }

        function deleteAnnouncement(id) {
            if (confirm('Are you sure you want to delete this announcement?')) {
                StorageManager.deleteAnnouncement(id);
                App.showToast('Announcement deleted', 'success');
                loadAnnouncements();
            }
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                AuthManager.logout();
                window.location.href = 'index.html';
            }
        }
    </script>
    <script type="module" src="firebase-config.js"></script>
<script type="module" src="js/firebase-sync.js"></script>
 
</body>
</html>
