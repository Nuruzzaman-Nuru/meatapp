<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Login - Monthly Contribution Management System</title>
    <link rel="stylesheet" href="css/style.css?v=mobile-menu-6">
</head>
<body>
    <header class="site-header">
        <div class="container site-header-content">
            <a class="site-brand" href="index.html">মাংসের সমিতি</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="contact.html">Contact</a>
                <a class="nav-login-btn" href="login.html">Login</a>
                <a class="nav-register-btn" href="register.html">Register</a>
            </nav>
        </div>
    </header>

    <main class="auth-page">
        <section class="member-access">
            <div class="section-heading">
                <p class="section-kicker">Member Area</p>
                <h2>Login to your account</h2>
            </div>

            <div id="loginForm">
                <h1>Login</h1>
                <div id="loginAlert" class="alert"></div>

                <div class="form-group">
                    <label for="loginPhone">Phone Number</label>
                    <input type="tel" id="loginPhone" placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="password-field">
                        <input type="password" id="loginPassword" placeholder="Enter your password">
                        <button class="password-toggle" type="button" onclick="togglePasswordVisibility('loginPassword', this)" aria-label="Show password">Show</button>
                    </div>
                </div>

                <div class="form-buttons">
                    <button class="btn btn-primary btn-block" onclick="handleLogin()">Login</button>
                </div>

                <div class="switch-form">
                    Don't have an account? <a href="register.html">Register here</a>
                </div>
            </div>
        </section>
    </main>

    <div data-include="footer"></div>

    <script src="js/components.js?v=mobile-menu-6"></script>

    <script src="js/storage.js"></script>
    <script src="js/auth.js?v=firebase-only-7"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            fillPhoneFromLoginLink();
            AuthManager.blockIfLoggedIn();
        });

        function fillPhoneFromLoginLink() {
            const params = new URLSearchParams(window.location.search);
            const phone = params.get('phone') || params.get('number') || params.get('mobile');
            if (!phone) return;

            const phoneInput = document.getElementById('loginPhone');
            if (phoneInput) {
                phoneInput.value = phone.trim();
            }
        }

        async function handleLogin() {
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;
            const result = await AuthManager.login(phone, password);
            const alert = document.getElementById('loginAlert');

            if (result.success) {
                alert.className = 'alert alert-success';
                alert.textContent = result.message;
                alert.style.display = 'block';

                const user = AuthManager.getCurrentUser();
                window.location.href = user.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
            } else {
                alert.className = 'alert alert-error';
                alert.textContent = result.message;
                alert.style.display = 'block';
            }
        }

        function togglePasswordVisibility(inputId, button) {
            const input = document.getElementById(inputId);
            const shouldShow = input.type === 'password';
            input.type = shouldShow ? 'text' : 'password';
            button.textContent = shouldShow ? 'Hide' : 'Show';
            button.setAttribute('aria-label', shouldShow ? 'Hide password' : 'Show password');
        }

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
    </script>
    <script type="module" src="firebase-config.js"></script>
<script type="module" src="js/firebase-sync.js?v=firebase-only-6"></script>
</body>
</html>
